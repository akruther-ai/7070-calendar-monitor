name: Test GitHub mobile notification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/test-trigger.txt'

permissions:
  issues: write

jobs:
  send-test-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create assigned/mentioned test issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "TEST — GitHub Actions mobile notification" \
            --body $'@akruther-ai **GitHub Actions notification test.**\n\nThis issue was created by the GitHub Actions bot from a repository-push trigger. If GitHub Mobile push notifications are configured correctly, you should receive an assignment/direct-mention notification.' \
            --assignee akruther-ai
