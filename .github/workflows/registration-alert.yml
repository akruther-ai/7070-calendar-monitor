name: 7070 registration alerts

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, offset from the top of the hour to reduce GitHub cron congestion.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  push:
    paths:
      - 'registration-alert.js'
      - 'data/middle-school.json'
      - '.github/workflows/registration-alert.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: 7070-registration-monitor
  cancel-in-progress: false

jobs:
  check-registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check for newly opened registration windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node registration-alert.js

      - name: Save alert state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registration-alerted.json
          if git diff --cached --quiet; then
            echo "No alert-state changes to commit."
          else
            git commit -m "Update 7070 registration alert state"
            git pull --rebase origin main
            git push
          fi

      - name: Report degraded registration monitor
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title='7070 MONITOR DEGRADED: registration checker'
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -z "$existing" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body $'@akruther-ai **The 5-minute 7070 registration checker failed.**\n\nThe 15-minute fresh-calendar workflow remains a backup path, but the monitor is degraded until a later run succeeds.' \
              --assignee akruther-ai
          else
            echo "Degraded-monitor issue #$existing is already open."
          fi

      - name: Clear degraded registration monitor alert after recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title='7070 MONITOR DEGRADED: registration checker'
          gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | \
          while read -r issue; do
            [ -n "$issue" ] && gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed --comment 'Automated recovery: the registration checker completed successfully.'
          done
