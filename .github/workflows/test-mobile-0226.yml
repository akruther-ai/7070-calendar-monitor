name: Test GitHub mobile 02:26 MT

on:
  workflow_dispatch:
  schedule:
    # 02:26 MDT on Aug 25 = 08:26 UTC. Guard below makes this effectively one-time for 2026.
    - cron: '26 8 25 8 *'

permissions:
  issues: write

jobs:
  send-test-issue:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '26 8 25 8 *'
    runs-on: ubuntu-latest
    steps:
      - name: Only run scheduled test in 2026
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%Y)" != "2026" ]; then
            echo "Not 2026; skipping."
            exit 1
          fi

      - name: Create assigned/mentioned test issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "TEST 02:26 — 7070 GitHub mobile notification" \
            --body $'@akruther-ai **Scheduled GitHub Mobile test.**\n\nThis issue was generated by GitHub Actions at the 02:26 AM Mountain test slot. If mobile notifications are configured correctly, you should receive an assignment/direct-mention push.' \
            --assignee akruther-ai
