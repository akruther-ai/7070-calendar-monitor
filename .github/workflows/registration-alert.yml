name: 7070 registration alerts

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, offset from the top of the hour to reduce GitHub cron congestion.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  push:
    paths:
      - 'registration-alert.js'
      - '.github/workflows/registration-alert.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: 7070-registration-monitor
  cancel-in-progress: false

jobs:
  check-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for newly opened registration windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node registration-alert.js

      - name: Save alert state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registration-alerted.json
          if git diff --cached --quiet; then
            echo "No alert-state changes to commit."
          else
            git commit -m "Update 7070 registration alert state"
            git push
          fi
