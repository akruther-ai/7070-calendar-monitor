name: Update 7070 calendar

on:
  workflow_dispatch:
  schedule:
    # Refresh the live PushPress calendar every 15 minutes, offset from checks.
    - cron: '3,18,33,48 * * * *'
  push:
    branches: [main]
    paths:
      - 'scrape.js'
      - 'registration-alert.js'
      - 'lib/registration-time.js'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: write
  issues: write

concurrency:
  # Calendar refreshes never write registration state, so they can run while a
  # registration watcher is waiting for an exact opening time.
  group: 7070-calendar-refresh
  queue: single

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 7

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Queued runs should start from the latest calendar snapshot.
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked JavaScript dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run deterministic checks
        run: npm run check

      - name: Capture live calendar with system Chrome
        run: npm run scrape

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json data/middle-school.json
          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
          else
            git commit -m "Update 7070 calendar"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              echo "Calendar push raced another workflow; retrying ($attempt/3)."
            done
            echo "Calendar push failed after three attempts."
            exit 1
          fi

  calendar-health:
    needs: scrape
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Report failure or clear recovered health alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title='7070 MONITOR DEGRADED: calendar refresh'
          query="repo:${GITHUB_REPOSITORY} is:issue is:open in:title \"${title}\""
          issues=$(gh api --method GET search/issues -f q="$query" -f per_page=100 --jq ".items[] | select(.title == \"$title\") | .number")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ '${{ needs.scrape.result }}' != 'success' ]; then
            existing=$(echo "$issues" | sed -n '1p')
            if [ -z "$existing" ]; then
              body=$'@akruther-ai **The 15-minute live 7070 calendar refresh failed or timed out.**\n\nThe registration watcher will continue using the last known good feed, but schedule changes or new classes may be stale until a refresh succeeds.\n\nFailed run: '"${run_url}"
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee akruther-ai
            else
              echo "Degraded-monitor issue #$existing is already open."
            fi
          else
            for issue in $issues; do
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed --comment 'Automated recovery: the live calendar refresh completed successfully.'
            done
          fi
