name: Update 7070 calendar

on:
  workflow_dispatch:
  schedule:
    # Refresh the live PushPress calendar every 15 minutes, offset from alert checks.
    - cron: '3,18,33,48 * * * *'
  push:
    branches: [main]
    paths:
      - 'scrape.js'
      - 'package.json'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: write
  issues: write

concurrency:
  # Shared with the 5-minute checker so feed/state writes and alerts never overlap.
  group: 7070-registration-monitor
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live calendar
        run: npm run scrape

      - name: Check registration openings against fresh calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node registration-alert.js

      - name: Commit updated calendar and alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json data/middle-school.json data/registration-alerted.json
          if git diff --cached --quiet; then
            echo "No calendar or alert-state changes to commit."
          else
            git commit -m "Update 7070 calendar/alert state"
            git pull --rebase origin main
            git push
          fi
