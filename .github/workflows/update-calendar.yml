name: Update 7070 calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'scrape.js'
      - 'package.json'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: write

concurrency:
  group: update-7070-calendar
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live calendar
        run: npm run scrape

      - name: Commit updated calendar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json data/middle-school.json
          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
          else
            git commit -m "Update 7070 calendar data"
            git push
          fi
