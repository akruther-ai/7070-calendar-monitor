name: 7070 registration alerts

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is best-effort. Start redundant watchers twice per hour; once
    # allocated, each watcher waits inside its runner for imminent openings.
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'registration-alert.js'
      - 'lib/registration-time.js'
      - 'data/middle-school.json'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - '.github/workflows/registration-alert.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: 7070-registration-watcher
  # Keep the active watch window and only the newest pending successor.
  queue: single

jobs:
  check_registration:
    runs-on: ubuntu-24.04
    # The script watches for at most 5h15m, leaving setup/commit headroom under
    # GitHub's six-hour hosted-runner limit.
    timeout-minutes: 330

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Queued runs must start from state committed by the preceding run,
          # not from the older SHA that originally triggered this run.
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked JavaScript dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run deterministic checks
        run: npm run check

      - name: Watch advance and live registration windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node registration-alert.js --watch

      - name: Save alert state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registration-alerted.json
          if git diff --cached --quiet; then
            echo "No alert-state changes to commit."
          else
            git commit -m "Update 7070 registration alert state"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              echo "Alert-state push raced another workflow; retrying ($attempt/3)."
            done
            echo "Alert-state push failed after three attempts."
            exit 1
          fi

  registration_health:
    needs: check_registration
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Report failure or clear recovered health alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title='7070 MONITOR DEGRADED: registration checker'
          query="repo:${GITHUB_REPOSITORY} is:issue is:open in:title \"${title}\""
          issues=$(gh api --method GET search/issues -f q="$query" -f per_page=100 --jq ".items[] | select(.title == \"$title\") | .number")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ '${{ needs.check_registration.result }}' != 'success' ]; then
            existing=$(echo "$issues" | sed -n '1p')
            if [ -z "$existing" ]; then
              body=$'@akruther-ai **The GitHub-hosted 7070 registration watcher failed or timed out.**\n\nA later watcher will retry from the last known good feed, and issue markers protect against duplicate alerts, but the monitor is degraded until a run succeeds.\n\nFailed run: '"${run_url}"
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee akruther-ai
            else
              echo "Degraded-monitor issue #$existing is already open."
            fi
          else
            for issue in $issues; do
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed --comment 'Automated recovery: the registration watcher completed successfully.'
            done
          fi
